name: Release

# Builds the Windows installers and a universal macOS app (.dmg, Apple Silicon and Intel) and, for a tag such as v0.20.0, attaches
# them to a GitHub Release. Run it by hand from the Actions tab ("Run workflow") to get the installers as downloadable artifacts.
#
# Optional repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD)   signed in-app updates
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD (an app-specific password), APPLE_TEAM_ID   Developer ID signing and notarisation of the Mac app.
# Without the Apple secrets the Mac app is ad-hoc signed only: macOS shows "cannot be opened because Apple cannot check it for
# malicious software" the first time (see docs/MAC.md for the two ways to open it).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install, typecheck, test
        working-directory: app
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
      - name: Rust checks
        working-directory: app/src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Build installers
        working-directory: app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --bundles nsis,msi --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            npx tauri build --bundles nsis,msi
          fi
      - name: Portable zip and checksums
        shell: pwsh
        run: |
          $rel = "app/src-tauri/target/release"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "$rel/bundle/nsis/*.exe" out
          Copy-Item "$rel/bundle/msi/*.msi" out
          Copy-Item "$rel/greenroom-local.exe" "out/Greenroom Local.exe"
          Compress-Archive -Path "out/Greenroom Local.exe" -DestinationPath "out/Greenroom-Local-portable.zip"
          Remove-Item "out/Greenroom Local.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: out/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install, typecheck, test
        working-directory: app
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
      - name: Rust checks on a Mac (advisory, problems are reported as annotations and the installer is still built)
        working-directory: app/src-tauri
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets -- -D warnings > "$RUNNER_TEMP/clippy.log" 2>&1; c1=$?
          cargo test > "$RUNNER_TEMP/test.log" 2>&1; c2=$?
          python3 ../../scripts/ci_report.py "$RUNNER_TEMP" "$c1" "$c2"
          exit 0
      - name: Import the Developer ID certificate (only when the secrets exist)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
            security create-keychain -p ci build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p ci build.keychain
            security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
            rm cert.p12
          else
            echo "No Apple certificate secret: the app will be ad-hoc signed only."
          fi
      - name: Build the universal app and .dmg
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --target universal-apple-darwin --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            npx tauri build --target universal-apple-darwin --bundles dmg
          fi
      - name: Collect
        run: |
          mkdir -p out
          cp app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg out/
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: out/*

  publish:
    needs: [windows, macos]
    # publish what was built even if the Mac job failed outright, so the Windows installers are never held back by it
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: collected
          merge-multiple: true
      - name: Checksums
        run: |
          cd collected
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: all-installers
          path: collected/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" collected/* --repo "${{ github.repository }}" --title "Greenroom Local ${{ github.ref_name }}" --generate-notes
